<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jerry｜刮刮樂記帳</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <!-- ============ HOME ============ -->
    <section class="view" id="view-home">
      <header class="topbar">
        <h1 class="brand">刮刮樂記帳</h1>
        <button class="user-badge" id="user-badge" aria-label="切換使用者">
          <span id="user-badge-name">使用者</span>
        </button>
      </header>

      <div class="scroll-area">
        <div class="card">
          <p class="card-label">累計損益</p>
          <p class="pl-figure" id="home-pl">NT$ 0</p>
        </div>

        <div class="card">
          <p class="card-label">投資報酬率 (ROI)</p>
          <p class="roi-figure" id="home-roi">0.0<span class="roi-pct">%</span></p>
          <div class="stat-grid">
            <div class="stat-cell">
              <p class="stat-label">總投入</p>
              <p class="stat-value" id="home-invested">NT$ 0</p>
            </div>
            <div class="stat-cell">
              <p class="stat-label">總損益</p>
              <p class="stat-value" id="home-net">NT$ 0</p>
            </div>
            <div class="stat-cell">
              <p class="stat-label">累計張數</p>
              <p class="stat-value" id="home-count">0 張</p>
            </div>
          </div>
        </div>

        <div class="card jackpot-card" id="jackpot-card">
          <p class="card-label">刮刮樂大獎</p>
          <div id="jackpot-body" class="jackpot-empty">
            <p class="jackpot-emoji">🤞</p>
            <p class="jackpot-caption">尚未中獎，再刮一張試試手氣！</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ RECORDS ============ -->
    <section class="view hidden" id="view-records">
      <header class="topbar">
        <h1 class="brand records-title">紀錄</h1>
        <button class="icon-btn" id="btn-add-from-records" aria-label="新增紀錄">＋</button>
      </header>
      <div class="scroll-area">
        <ul class="record-list" id="record-list"></ul>
        <p class="empty-state hidden" id="records-empty">目前還沒有任何紀錄</p>
      </div>
    </section>

    <!-- ============ ANALYTICS ============ -->
    <section class="view hidden" id="view-analytics">
      <header class="topbar">
        <h1 class="brand records-title">分析</h1>
      </header>
      <div class="scroll-area">
        <div class="segmented" id="period-toggle">
          <button class="segment active" data-period="year">年度</button>
          <button class="segment" data-period="month">每月</button>
        </div>

        <div class="card">
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-dot dot-invested"></span>購買總金額</span>
            <span class="legend-item"><span class="legend-dot dot-won"></span>中獎金額</span>
          </div>
          <div class="chart-wrap">
            <canvas id="analytics-chart" height="240"></canvas>
          </div>
          <p class="empty-state hidden" id="analytics-empty">目前還沒有資料可以分析</p>
        </div>
      </div>
    </section>

    <!-- ============ BOTTOM NAV ============ -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="home" aria-label="首頁">
        <svg viewBox="0 0 24 24" class="nav-icon">
          <path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
          <path
            d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
      </button>
      <button class="nav-btn" data-view="analytics" aria-label="分析">
        <svg viewBox="0 0 24 24" class="nav-icon">
          <path d="M4 20V10M11 20V4M18 20v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button class="nav-btn nav-fab" id="btn-add-from-nav" aria-label="新增紀錄">＋</button>
      <button class="nav-btn" data-view="records" aria-label="紀錄">
        <svg viewBox="0 0 24 24" class="nav-icon">
          <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linejoin="round" />
          <path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </nav>

    <!-- ============ ADD RECORD MODAL ============ -->
    <div class="modal-overlay hidden" id="modal-overlay">
      <div class="modal-sheet">
        <header class="modal-header">
          <button class="modal-text-btn" id="btn-cancel">取消</button>
          <h2 class="modal-title" id="modal-title">新紀錄</h2>
          <button class="modal-text-btn modal-confirm" id="btn-confirm">完成</button>
        </header>

        <div class="modal-body">
          <p class="section-label">刮刮樂售價</p>
          <div class="price-grid" id="price-grid">
            <button class="price-btn" data-price="100">100 元</button>
            <button class="price-btn" data-price="200">200 元</button>
            <button class="price-btn" data-price="300">300 元</button>
            <button class="price-btn" data-price="500">500 元</button>
            <button class="price-btn" data-price="1000">1000 元</button>
            <button class="price-btn" data-price="2000">2000 元</button>
          </div>

          <p class="section-label">購買日</p>
          <div class="amount-field">
            <input type="date" id="purchase-date-input">
          </div>

          <p class="section-label">刮中金額</p>
          <div class="segmented" id="win-toggle">
            <button class="segment active" data-win="true">中獎</button>
            <button class="segment" data-win="false">未中獎</button>
          </div>

          <div class="amount-field" id="amount-field">
            <span class="amount-prefix">NT$</span>
            <input type="number" inputmode="numeric" id="amount-input" placeholder="請輸入金額" min="0">
          </div>

          <p class="section-label">刮刮樂卡片號</p>
          <div class="amount-field">
            <input type="text" id="ticket-code-input" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="請輸入刮刮樂卡片號（選填）">
          </div>
        </div>
      </div>
    </div>

    <!-- ============ USERNAME MODAL ============ -->
    <div class="modal-overlay hidden" id="user-modal-overlay">
      <div class="modal-sheet">
        <header class="modal-header">
          <button class="modal-text-btn hidden" id="user-btn-cancel">取消</button>
          <h2 class="modal-title">使用者</h2>
          <button class="modal-text-btn modal-confirm" id="user-btn-confirm">確定</button>
        </header>
        <div class="modal-body">
          <p class="section-label" id="user-modal-hint">輸入使用者名稱，你的紀錄會儲存在雲端並跟這個名稱綁定</p>
          <div class="amount-field">
            <input type="text" id="username-input" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="請輸入使用者名稱">
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
